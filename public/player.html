<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Основной экран</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f9ff;
      --surface: #ffffff;
      --surface-border: #d9e2ef;
      --text: #113355;
      --text-secondary: #0a2a4a;
      --muted: #5a6f8a;
      --timer-bg: #e2eaf5;
      --timer-color: #1a5a9c;
      --timer-overtime-bg: #ff6b6b;
      --timer-overtime-color: white;
      --table-th-bg: #e2eaf5;
      --table-border: #d9e2ef;
      --badge-bg: white;
      --badge-border: #bcc9db;
      --btn-bg: white;
      --btn-border: #bcc9db;
      --btn-color: #113355;
      --btn-hover: #e2eaf5;
      --topbar-bg: white;
      --card-bg: white;
      --img-border: #d9e2ef;
    }
    [data-theme="dark"] {
      --bg: #0d1117;
      --surface: #161b22;
      --surface-border: #30363d;
      --text: #e6edf3;
      --text-secondary: #c9d1d9;
      --muted: #8b949e;
      --timer-bg: #21262d;
      --timer-color: #58a6ff;
      --timer-overtime-bg: #da3633;
      --timer-overtime-color: white;
      --table-th-bg: #21262d;
      --table-border: #30363d;
      --badge-bg: #21262d;
      --badge-border: #30363d;
      --btn-bg: #21262d;
      --btn-border: #30363d;
      --btn-color: #e6edf3;
      --btn-hover: #30363d;
      --topbar-bg: #161b22;
      --card-bg: #161b22;
      --img-border: #30363d;
    }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      margin: 0;
      padding: 0;
      transition: background 0.3s, color 0.3s;
    }
    .tvWrap {
      max-width: 1400px;
      margin: 0 auto;
      padding: 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .tvWrap:-webkit-full-screen {
      max-width: 100%;
      padding: 20px;
      width: 100%;
    }
    .tvWrap:fullscreen {
      max-width: 100%;
      padding: 20px;
      width: 100%;
    }
    .tvTop {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      background: var(--topbar-bg);
      border-radius: 16px;
      padding: 12px 20px;
      border: 1px solid var(--surface-border);
      transition: background 0.3s, border-color 0.3s;
    }
    .tvPhase {
      font-size: 24px;
      font-weight: 600;
      color: var(--text-secondary);
    }
    .tvCount {
      font-size: 14px;
      color: var(--muted);
      margin-top: 4px;
    }
    .tvTimerNum {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--timer-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 600;
      color: var(--timer-color);
      transition: background 0.2s, color 0.2s;
    }
    .tvTimerNum.overtime {
      background: var(--timer-overtime-bg);
      color: var(--timer-overtime-color);
    }
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      border: 1px solid var(--surface-border);
      margin-bottom: 20px;
      flex: 1;
      transition: background 0.3s, border-color 0.3s;
    }
    .split {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
    }
    .image-col {
      flex: 0 0 40%;
      max-width: 500px;
    }
    .text-col {
      flex: 1 1 50%;
    }
    .tvImg {
      width: 100%;
      max-height: 60vh;
      object-fit: contain;
      border-radius: 12px;
      border: 1px solid var(--img-border);
    }
    .tvText {
      font-size: clamp(28px, 3vw, 48px);
      line-height: 1.3;
      white-space: pre-wrap;
    }
    .tvAnswer {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--surface-border);
    }
    .centerAnswer {
      border-top: none;
      min-height: 50vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .centerAnswer .tvText {
      text-align: center;
      font-weight: 600;
    }
    .tvTableWrap {
      margin-top: 20px;
    }
    .tvScoreTable {
      width: 100%;
      border-collapse: collapse;
    }
    .tvScoreTable th,
    .tvScoreTable td {
      border: 1px solid var(--table-border);
      padding: 10px;
      text-align: center;
    }
    .tvScoreTable th {
      background: var(--table-th-bg);
      font-weight: 600;
    }
    .tvScoreTable tr.exhibition-row {
      font-style: italic;
    }
    .hidden { display: none !important; }
    .bottom-bar {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding: 12px 0;
      border-top: 1px solid var(--surface-border);
    }
    .bottom-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 12px;
      border-radius: 30px;
      background: var(--badge-bg);
      border: 1px solid var(--badge-border);
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
    }
    .btn-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 12px;
      border-radius: 30px;
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: var(--btn-color);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }
    .btn-icon:hover {
      background: var(--btn-hover);
    }
    .btn-icon.sound-on {
      background: var(--btn-hover);
    }
    .copyright {
      color: var(--muted);
      font-size: 13px;
    }
    .logos {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .logos img {
      height: 30px;
    }
    @media (max-width: 700px) {
      .split { flex-direction: column; }
      .image-col { max-width: 100%; }
      .bottom-bar { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="tvWrap" id="tvWrap">
    <div class="tvTop">
      <div>
        <div class="tvPhase" id="phaseTitle">Ждите</div>
        <div class="tvCount" id="countTitle">—</div>
      </div>
      <div class="tvTimer">
        <div class="tvTimerNum" id="timerValueDiv">60</div>
      </div>
    </div>

    <div class="card">
      <div class="split">
        <div class="image-col" id="imageColumn">
          <img id="questionImg" class="tvImg hidden" alt="Раздатка">
          <img id="commentImg" class="tvImg hidden" alt="Картинка комментария">
        </div>
        <div class="text-col">
          <div id="questionText" class="tvText"></div>
          <div id="answerBlock" class="tvAnswer hidden">
            <div id="answerText" class="tvText"></div>
          </div>
        </div>
      </div>

      <div id="scoreWrap" class="tvTableWrap hidden">
        <table class="tvScoreTable">
          <thead id="scoreHead"></thead>
          <tbody id="scoreBody"></tbody>
        </table>
      </div>
    </div>

    <div class="bottom-bar">
      <div class="bottom-left">
        <span class="badge" id="connBadge">WebSocket: …</span>
        <span id="soundControls" style="display:none;">
          <button class="btn-icon" id="soundToggle">🔇 Звук выкл</button>
          <button id="btnUnlockAudio" class="btn-icon">🔓 Разрешить звук</button>
        </span>
        <button class="btn-icon" id="themeToggle">🌙 Тёмная тема</button>
        <button class="btn-icon" id="fullscreenToggle">⛶ На весь экран</button>
        <span class="copyright">© Лига Естественного Интеллекта</span>
      </div>
      <div class="logos">
        <img src="/logo-profsouz.png" alt="Профсоюз">
        <img src="/logo-gazprom.png" alt="ПАО Газпром">
      </div>
    </div>
  </div>

  <script>
    (function() {
      let ws = null;
      let reconnectAttempts = 0;
      const maxReconnectDelay = 30000;

      const connBadge = document.getElementById('connBadge');
      const phaseTitle = document.getElementById('phaseTitle');
      const countTitle = document.getElementById('countTitle');
      const timerValueDiv = document.getElementById('timerValueDiv');
      const questionImg = document.getElementById('questionImg');
      const commentImg = document.getElementById('commentImg');
      const questionText = document.getElementById('questionText');
      const answerBlock = document.getElementById('answerBlock');
      const answerText = document.getElementById('answerText');
      const imageColumn = document.getElementById('imageColumn');
      const scoreWrap = document.getElementById('scoreWrap');
      const scoreHead = document.getElementById('scoreHead');
      const scoreBody = document.getElementById('scoreBody');
      const soundToggle = document.getElementById('soundToggle');
      const btnUnlockAudio = document.getElementById('btnUnlockAudio');
      const themeToggle = document.getElementById('themeToggle');
      const fullscreenToggle = document.getElementById('fullscreenToggle');
      const tvWrap = document.getElementById('tvWrap');

      let shown = { phase: 'waiting' };
      let timer = { running: false, remainingSec: 60, overtimeActive: false };
      let totalQuestions = 0;
      let lastTable = null;
      let lastQuestionIndex = null;

      let soundsData = { beep: null, gong: null };
      let soundAllowed = false;
      let soundEnabled = false;
      let audioUnlocked = false;
      let warnedAt0 = false;
      let gongPlayed = false;
      const soundControls = document.getElementById('soundControls');

      // ---- Theme ----
      let darkTheme = localStorage.getItem('playerTheme') === 'dark';

      function applyTheme() {
        if (darkTheme) {
          document.documentElement.setAttribute('data-theme', 'dark');
          themeToggle.textContent = '☀️ Светлая тема';
          if (connBadge) connBadge.style.background = 'var(--badge-bg)';
        } else {
          document.documentElement.removeAttribute('data-theme');
          themeToggle.textContent = '🌙 Тёмная тема';
        }
        localStorage.setItem('playerTheme', darkTheme ? 'dark' : 'light');
      }

      // ---- Fullscreen ----
      function isFullscreen() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement);
      }

      function toggleFullscreen() {
        if (!isFullscreen()) {
          const el = document.documentElement;
          if (el.requestFullscreen) {
            el.requestFullscreen().catch(() => {});
          } else if (el.webkitRequestFullscreen) {
            el.webkitRequestFullscreen();
          }
        } else {
          if (document.exitFullscreen) {
            document.exitFullscreen().catch(() => {});
          } else if ( document.webkitExitFullscreen ) {
            document.webkitExitFullscreen();
          }
        }
      }

      function updateFullscreenButton() {
        fullscreenToggle.textContent = isFullscreen() ? '⛶ Выйти из fullscreen' : '⛶ На весь экран';
      }

      document.addEventListener('fullscreenchange', updateFullscreenButton);
      document.addEventListener('webkitfullscreenchange', updateFullscreenButton);

      // ---- Sound ----
      function updateSoundVisibility() {
        soundControls.style.display = soundAllowed ? 'inline' : 'none';
      }

      function updateSoundButton() {
        if (soundEnabled) {
          soundToggle.innerHTML = '🔊 Звук вкл';
          soundToggle.classList.add('sound-on');
        } else {
          soundToggle.innerHTML = '🔇 Звук выкл';
          soundToggle.classList.remove('sound-on');
        }
      }

     function unlockAudio() {
      if (audioUnlocked) return;
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) {
        alert('Ваш браузер не поддерживает звук');
        return;
      }
      const audioCtx = new AudioCtx();
      const buffer = audioCtx.createBuffer(1, 1, 22050);
      const source = audioCtx.createBufferSource();
      source.buffer = buffer;
      source.connect(audioCtx.destination);
      source.start();
      audioCtx.resume().then(() => {
        audioUnlocked = true;
        alert('Звук разблокирован');
      }).catch(e => {
        console.warn('Unlock failed', e);
        alert('Не удалось разблокировать звук. Нажмите ещё раз.');
      });
    }

      function playBeep(type) {
        if (!soundAllowed) return;
        if (!soundEnabled) return;
        if (!audioUnlocked) return;
        const dataUrl = type === 'short' ? soundsData.beep : soundsData.gong;
        if (!dataUrl) return;
        const audio = new Audio(dataUrl);
        audio.play().catch(e => console.warn('Play error:', e));
      }

      function setVisible(el, on) {
        if (el) el.classList.toggle('hidden', !on);
      }

      function escapeHtml(s) {
        return String(s ?? '').replace(/[&<>"']/g, ch => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        })[ch]);
      }

      function renderScoreTableFull() {
        if (!lastTable) return;
        const qCount = lastTable.questionsCount ?? 0;
        let h = '<th>#</th><th>Команда</th>';
        for (let i = 0; i < qCount; i++) h += `<th>${i+1}</th>`;
        h += '<th>Итог</th>';
        scoreHead.innerHTML = h;
        scoreBody.innerHTML = '';
        (lastTable.rows || []).forEach((r, idx) => {
          let row = `<td style="text-align:center;">${idx+1}</td><td style="text-align:left;">${escapeHtml(r.name)}</td>`;
          for (let i = 0; i < qCount; i++) {
            const v = (r.perQuestion || [])[i];
            row += `<td>${v === true ? '+' : (v === false ? '−' : '')}</td>`;
          }
          row += `<td><strong>${r.total ?? 0}</strong></td>`;
          const tr = document.createElement('tr');
          tr.innerHTML = row;
          if (r.exhibition) tr.classList.add('exhibition-row');
          scoreBody.appendChild(tr);
        });
      }

      function checkSound() {
        if (!shown || shown.phase !== 'question') return;
        if (timer.remainingSec === 0) {
          if (!timer.overtimeActive && !warnedAt0) {
            warnedAt0 = true;
            playBeep('short');
          } else if (timer.overtimeActive && !gongPlayed) {
            gongPlayed = true;
            playBeep('gong');
          }
        }
      }

      function renderPhase() {
        timerValueDiv.textContent = timer.remainingSec ?? 60;
        if (timer.overtimeActive) {
          timerValueDiv.classList.add('overtime');
        } else {
          timerValueDiv.classList.remove('overtime');
        }

        if (shown && (shown.phase === 'question' || shown.phase === 'answer')) {
          const n = (shown.qIndex ?? 0) + 1;
          let title = '';
          if (shown.isWarmup) {
            title = `Разминочный ${shown.warmupNumber}`;
          } else {
            const displayNumber = shown.displayNumber !== undefined ? shown.displayNumber : n;
            title = shown.phase === 'question' ? `Вопрос ${displayNumber}` : `Ответ ${displayNumber}`;
          }
          phaseTitle.textContent = title;
          countTitle.textContent = '';
        } else {
          phaseTitle.textContent = 'Ждите';
          countTitle.textContent = '';
        }

        setVisible(scoreWrap, false);
        setVisible(answerBlock, false);
        answerBlock.classList.remove('centerAnswer');

        questionImg.src = shown.handoutImage || '';
        commentImg.src = shown.commentImage || '';

        const hasHandout = !!shown.handoutImage;
        const hasCommentImg = !!shown.commentImage;
        const hasAnyImage = hasHandout || hasCommentImg;

        setVisible(imageColumn, hasAnyImage);

        if (!shown || shown.phase === 'waiting') {
          phaseTitle.textContent = 'Ждите';
          questionText.textContent = 'Игра скоро начнётся.';
          setVisible(questionImg, false);
          setVisible(commentImg, false);
          return;
        }

        if (shown.phase === 'break') {
          phaseTitle.textContent = 'Перерыв';
          questionText.textContent = 'Пауза.';
          setVisible(questionImg, false);
          setVisible(commentImg, false);
          return;
        }

        if (shown.phase === 'table') {
          phaseTitle.textContent = 'Таблица результатов';
          questionText.textContent = '';
          setVisible(scoreWrap, true);
          setVisible(questionImg, false);
          setVisible(commentImg, false);
          renderScoreTableFull();
          return;
        }

        if (shown.phase === 'question') {
          setVisible(questionImg, hasHandout);
          setVisible(commentImg, false);
          questionText.textContent = shown.questionText || '';
          setVisible(answerBlock, false);
          if (lastQuestionIndex !== shown.qIndex) {
            lastQuestionIndex = shown.qIndex;
            warnedAt0 = false;
            gongPlayed = false;
          }
        } else {
          setVisible(questionImg, false);
          setVisible(commentImg, hasCommentImg);
          questionText.textContent = '';
          setVisible(answerBlock, true);
          const a = shown.answerText || '';
          const c = shown.commentText || '';
          answerText.textContent = c ? `${a}\n\n${c}` : a;
          if (!hasCommentImg) {
            answerBlock.classList.add('centerAnswer');
          }
        }
        checkSound();
      }

      function connectWebSocket() {
        const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
        ws = new WebSocket(`${protocol}://${location.host}/?role=player`);

        ws.onopen = () => {
          connBadge.textContent = 'Соединение: подключено';
          reconnectAttempts = 0;
        };

        ws.onerror = () => {
          connBadge.textContent = 'Соединение: ошибка';
        };

        ws.onclose = () => {
          connBadge.textContent = 'Соединение: закрыто, переподключение...';
          const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), maxReconnectDelay);
          reconnectAttempts++;
          setTimeout(connectWebSocket, delay);
        };

        ws.onmessage = (event) => {
          let msg;
          try { msg = JSON.parse(event.data); } catch { return; }
          const { type, payload } = msg || {};

          if (type === 'init_for_player') {
            shown = payload?.shown || { phase: 'waiting' };
            timer = payload?.timer || { running: false, remainingSec: 60, overtimeActive: false };
            soundsData = payload?.sounds || { beep: null, gong: null };
            soundAllowed = payload?.soundEnabled === true;
            updateSoundVisibility();
            renderPhase();
          } else if (type === 'shown_update') {
            shown = payload || { phase: 'waiting' };
            renderPhase();
          } else if (type === 'timer_update') {
            timer = payload || { running: false, remainingSec: 60, overtimeActive: false };
            renderPhase();
          } else if (type === 'break_table') {
            lastTable = payload;
            totalQuestions = payload?.questionsCount || 0;
            if (shown && shown.phase === 'table') renderScoreTableFull();
            renderPhase();
          } else if (type === 'sounds_update') {
            soundsData = payload || { beep: null, gong: null };
          } else if (type === 'sound_permission') {
            soundAllowed = payload?.soundEnabled === true;
            if (!soundAllowed) soundEnabled = false;
            updateSoundVisibility();
            updateSoundButton();
          }
        };
      }

      connectWebSocket();

      soundToggle.onclick = () => {
        soundEnabled = !soundEnabled;
        updateSoundButton();
      };
      updateSoundButton();
      updateSoundVisibility();

      btnUnlockAudio.onclick = unlockAudio;

      // ---- Theme toggle ----
      applyTheme();
      themeToggle.onclick = () => {
        darkTheme = !darkTheme;
        applyTheme();
      };

      // ---- Fullscreen toggle ----
      updateFullscreenButton();
      fullscreenToggle.onclick = toggleFullscreen;

      // F11 key for fullscreen
      document.addEventListener('keydown', (e) => {
        if (e.key === 'F11') {
          e.preventDefault();
          toggleFullscreen();
        }
      });

      // Escape exits fullscreen naturally via browser API
    })();
  </script>
</body>
</html>
