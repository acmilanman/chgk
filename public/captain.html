<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Капитан</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f9ff;
      --text: #113355;
      --text-secondary: #0a2a4a;
      --muted: #5a6f8a;
      --surface: white;
      --surface-border: #d9e2ef;
      --badge-bg: white;
      --badge-border: #bcc9db;
      --timer-bg: #e2eaf5;
      --timer-color: #1a5a9c;
      --timer-ov-bg: #ff6b6b;
      --timer-ov-color: white;
      --btn-bg: white;
      --btn-border: #bcc9db;
      --btn-color: #113355;
      --btn-hover: #e2eaf5;
      --btn-primary-bg: #1a5a9c;
      --btn-primary-color: white;
      --btn-primary-hover: #0f4177;
      --select-bg: white;
      --select-color: #113355;
      --select-border: #bcc9db;
      --msg-ok-bg: #d4edda;
      --msg-ok-color: #155724;
      --msg-err-bg: #f8d7da;
      --msg-err-color: #721c24;
      --hr-color: #d9e2ef;
      --team-badge-bg: #e2eaf5;
      --disabled-bg: #e0e0e0;
      --bottom-border: #d9e2ef;
    }
    [data-theme="dark"] {
      --bg: #0d1117;
      --text: #e6edf3;
      --text-secondary: #c9d1d9;
      --muted: #8b949e;
      --surface: #161b22;
      --surface-border: #30363d;
      --badge-bg: #21262d;
      --badge-border: #30363d;
      --timer-bg: #21262d;
      --timer-color: #58a6ff;
      --timer-ov-bg: #da3633;
      --timer-ov-color: white;
      --btn-bg: #21262d;
      --btn-border: #30363d;
      --btn-color: #e6edf3;
      --btn-hover: #30363d;
      --btn-primary-bg: #1f6feb;
      --btn-primary-color: white;
      --btn-primary-hover: #388bfd;
      --select-bg: #21262d;
      --select-color: #e6edf3;
      --select-border: #30363d;
      --msg-ok-bg: #1b3a2a;
      --msg-ok-color: #7ee787;
      --msg-err-bg: #3a1b1b;
      --msg-err-color: #ff7b72;
      --hr-color: #30363d;
      --team-badge-bg: #30363d;
      --disabled-bg: #30363d;
      --bottom-border: #30363d;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      margin: 0;
      padding: 0;
      transition: background 0.3s, color 0.3s;
    }
    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 12px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .conn-bar {
      margin-bottom: 8px;
      text-align: left;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px 10px;
      border-radius: 30px;
      background: var(--badge-bg);
      border: 1px solid var(--badge-border);
      color: var(--text);
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface);
      border-radius: 40px;
      padding: 8px 16px;
      border: 1px solid var(--surface-border);
      margin-bottom: 16px;
      transition: background 0.3s, border-color 0.3s;
    }
    .phase-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-secondary);
    }
    .timer-circle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--timer-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 24px;
      color: var(--timer-color);
      flex-shrink: 0;
      transition: background 0.2s, color 0.2s;
    }
    .timer-circle.overtime {
      background: var(--timer-ov-bg);
      color: var(--timer-ov-color);
    }
    .card {
      background: var(--surface);
      border-radius: 24px;
      padding: 16px 20px;
      border: 1px solid var(--surface-border);
      margin-bottom: 12px;
      transition: background 0.3s, border-color 0.3s;
    }
    .head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    h2, h3 {
      color: var(--text);
      margin: 0 0 4px 0;
      font-weight: 600;
      font-size: 18px;
    }
    .hr {
      height: 1px;
      background: var(--hr-color);
      margin: 12px 0;
    }
    .btn {
      border: none;
      border-radius: 40px;
      padding: 10px 20px;
      font-weight: 600;
      cursor: pointer;
      font-size: 15px;
      border: 1px solid transparent;
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: var(--btn-color);
      transition: background 0.2s, color 0.2s;
    }
    .btn.ok {
      background: var(--btn-primary-bg);
      color: var(--btn-primary-color);
      border: none;
    }
    .btn.ok:hover {
      background: var(--btn-primary-hover);
    }
    .btn.small {
      padding: 6px 14px;
      font-size: 13px;
    }
    .btn-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 14px;
      border-radius: 40px;
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: var(--btn-color);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }
    .btn-icon:hover {
      background: var(--btn-hover);
    }
    .btn-icon.sound-on {
      background: var(--btn-hover);
    }
    select, textarea {
      background: var(--select-bg);
      border: 1px solid var(--select-border);
      border-radius: 16px;
      padding: 12px 16px;
      width: 100%;
      box-sizing: border-box;
      font-size: 16px;
      color: var(--select-color);
      transition: background 0.3s, border-color 0.3s, color 0.3s;
    }
    textarea {
      min-height: 100px;
      resize: vertical;
    }
    .qText {
      font-size: 18px;
      line-height: 1.4;
      white-space: pre-wrap;
    }
    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .grid.two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .hidden { display: none !important; }
    .msg.ok {
      background: var(--msg-ok-bg);
      color: var(--msg-ok-color);
      padding: 8px 12px;
      border-radius: 30px;
      font-size: 14px;
    }
    .msg.err {
      background: var(--msg-err-bg);
      color: var(--msg-err-color);
      padding: 8px 12px;
      border-radius: 30px;
      font-size: 14px;
    }
    .bottom-bar {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding: 12px 0;
      border-top: 1px solid var(--bottom-border);
    }
    .team-badge {
      background: var(--team-badge-bg);
      padding: 4px 12px;
      border-radius: 40px;
      font-size: 14px;
      color: var(--text);
    }
    @media (max-width: 700px) {
      .grid.two { grid-template-columns: 1fr; }
      .top-bar { padding: 6px 12px; }
      .timer-circle { width: 44px; height: 44px; font-size: 22px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="conn-bar">
      <span class="badge" id="connBadge">WebSocket: …</span>
    </div>

    <div class="top-bar">
      <span class="phase-title" id="phaseTitle">Ждите</span>
      <div class="timer-circle" id="timerCircleDiv">
        <div class="t" id="timerValue">60</div>
      </div>
    </div>

    <div id="teamBlock" class="card">
      <div class="head">
        <h2>Выберите команду</h2>
        <span class="badge">одно устройство</span>
      </div>
      <div class="small">Для смены используйте «Выход».</div>
      <div class="hr"></div>

      <select id="teamSelect">
        <option value="">-- Выберите --</option>
      </select>

      <div class="row" style="margin-top:12px;">
        <button id="btnPickTeam" class="btn ok">Подтвердить</button>
      </div>

      <div id="teamMsg" style="margin-top:10px;"></div>
    </div>

    <div id="waitBlock" class="card hidden">
      <div class="head">
        <h2>Ждите</h2>
        <span class="badge">скоро начнём</span>
      </div>
      <div class="qText">Игра скоро начнётся.</div>
    </div>

    <div id="breakBlock" class="card hidden">
      <div class="head">
        <h2 id="breakTitle">Перерыв</h2>
        <span class="badge" id="breakBadge">Пауза</span>
      </div>
      <div id="breakHint" class="small"></div>

      <div id="breakTableWrap" class="hidden" style="margin-top:12px;">
        <div class="hr"></div>
        <div class="row" style="justify-content:space-between;">
          <h3>Таблица результатов</h3>
          <button id="btnOpenFullTable" class="btn small">+/-</button>
        </div>
        <table style="width:100%; border-collapse:collapse;">
          <thead id="scoreHead"><th>Команда</th><th>Очки</th></thead>
          <tbody id="scoreBody"></tbody>
        </table>
      </div>
    </div>

    <div id="gameBlock" class="hidden">
      <div class="grid two">
        <div class="card">
          <img id="questionImg" class="qImage hidden" alt="Раздатка" style="max-width:100%; max-height:200px; object-fit:contain; margin-bottom:10px;">
          <div id="questionText" class="qText"></div>

          <div id="correctArea" class="hidden" style="margin-top:12px;">
            <div class="hr"></div>
            <h3>Ответ и комментарий</h3>
            <div id="correctText" class="qText"></div>
            <img id="commentImg" class="qImage hidden" alt="Картинка" style="max-width:100%; max-height:200px; object-fit:contain; margin-top:10px;">
          </div>
        </div>

        <div class="card">
          <div class="head">
            <h2>Ваш ответ</h2>
            <span class="team-badge" id="teamBadge">—</span>
          </div>

          <textarea id="answerInput" placeholder="Введите ответ..." disabled></textarea>

          <div style="margin-top:12px; display:flex; justify-content:flex-end;">
            <button id="btnSendAnswer" class="btn ok" disabled>Отправить</button>
          </div>

          <div id="answerMsg" style="margin-top:10px;"></div>
        </div>
      </div>
    </div>

    <div class="bottom-bar">
      <div class="row" style="gap:8px;">
        <span id="soundControls" style="display:none;">
          <button class="btn-icon" id="soundToggle">🔇 Звук выкл</button>
          <button id="btnUnlockAudio" class="btn-icon">🔓 Разрешить звук</button>
        </span>
        <button id="btnTheme" class="btn-icon">🌙 Тема</button>
        <button id="btnFullscreen" class="btn-icon">⛶ Во весь экран</button>
        <button id="btnLogout" class="btn-icon" style="display:none;">Выход</button>
      </div>
      <div class="row" style="gap:12px;">
        <img src="logo-profsouz.png" alt="logo" style="height:28px;">
        <img src="logo-gazprom.png" alt="logo" style="height:28px;">
      </div>
    </div>
  </div>

  <script>
    (function() {
      let ws = null;
      let reconnectAttempts = 0;
      const maxReconnectDelay = 30000;

      const connBadge = document.getElementById('connBadge');
      const btnLogout = document.getElementById('btnLogout');
      const btnTheme = document.getElementById('btnTheme');
      const btnFullscreen = document.getElementById('btnFullscreen');
      const teamBlock = document.getElementById('teamBlock');
      const teamSelect = document.getElementById('teamSelect');
      const btnPickTeam = document.getElementById('btnPickTeam');
      const teamMsg = document.getElementById('teamMsg');
      const waitBlock = document.getElementById('waitBlock');
      const breakBlock = document.getElementById('breakBlock');
      const breakTitle = document.getElementById('breakTitle');
      const breakBadge = document.getElementById('breakBadge');
      const breakHint = document.getElementById('breakHint');
      const breakTableWrap = document.getElementById('breakTableWrap');
      const btnOpenFullTable = document.getElementById('btnOpenFullTable');
      const scoreHead = document.getElementById('scoreHead');
      const scoreBody = document.getElementById('scoreBody');
      const gameBlock = document.getElementById('gameBlock');
      const phaseTitle = document.getElementById('phaseTitle');
      const timerValue = document.getElementById('timerValue');
      const timerCircleDiv = document.getElementById('timerCircleDiv');
      const questionImg = document.getElementById('questionImg');
      const questionText = document.getElementById('questionText');
      const correctArea = document.getElementById('correctArea');
      const correctText = document.getElementById('correctText');
      const commentImg = document.getElementById('commentImg');
      const teamBadge = document.getElementById('teamBadge');
      const answerInput = document.getElementById('answerInput');
      const btnSendAnswer = document.getElementById('btnSendAnswer');
      const answerMsg = document.getElementById('answerMsg');
      const soundToggle = document.getElementById('soundToggle');
      const btnUnlockAudio = document.getElementById('btnUnlockAudio');

      let teams = [];
      let myTeamId = null;
      let shown = { phase: 'waiting' };
      let timer = { running: false, remainingSec: 60, overtimeActive: false };
      let lastQuestionIndex = null;
      let hasSentThisQuestion = false;
      let lastTable = null;
      let lastSentText = '';

      let soundsData = { beep: null, gong: null };
      let soundAllowed = false;
      let soundEnabled = false;
      let audioUnlocked = false;
      let warnedAt0 = false;
      let gongPlayed = false;
      const soundControls = document.getElementById('soundControls');

      // ---- Theme ----
      let darkTheme = localStorage.getItem('captainTheme') === 'dark';

      function applyTheme() {
        if (darkTheme) {
          document.documentElement.setAttribute('data-theme', 'dark');
          btnTheme.textContent = '☀️ Тема';
        } else {
          document.documentElement.removeAttribute('data-theme');
          btnTheme.textContent = '🌙 Тема';
        }
        localStorage.setItem('captainTheme', darkTheme ? 'dark' : 'light');
      }

      // ---- Fullscreen ----
      function isFullscreen() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement);
      }

      function toggleFullscreen() {
        if (!isFullscreen()) {
          const el = document.documentElement;
          if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
          else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        } else {
          if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
          else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        }
      }

      function updateFullscreenBtn() {
        btnFullscreen.textContent = isFullscreen() ? '⛶ Выйти' : '⛶ Во весь экран';
      }

      document.addEventListener('fullscreenchange', updateFullscreenBtn);
      document.addEventListener('webkitfullscreenchange', updateFullscreenBtn);

      // ---- Sound ----
      function updateSoundVisibility() {
        soundControls.style.display = soundAllowed ? 'inline' : 'none';
      }

      function updateSoundButton() {
        if (soundEnabled) {
          soundToggle.innerHTML = '🔊 Звук вкл';
          soundToggle.classList.add('sound-on');
        } else {
          soundToggle.innerHTML = '🔇 Звук выкл';
          soundToggle.classList.remove('sound-on');
        }
      }

      function unlockAudio() {
        if (audioUnlocked) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) {
          if (teamMsg) teamMsg.innerHTML = '<div class="msg err">Ваш браузер не поддерживает звук</div>';
          return;
        }
        const audioCtx = new AudioCtx();
        const buffer = audioCtx.createBuffer(1, 1, 22050);
        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.connect(audioCtx.destination);
        source.start();
        audioCtx.resume().then(() => {
          audioUnlocked = true;
          if (teamMsg) teamMsg.innerHTML = '<div class="msg ok">Звук разблокирован</div>';
        }).catch(e => {
          console.warn('Unlock failed', e);
          if (teamMsg) teamMsg.innerHTML = '<div class="msg err">Не удалось разблокировать звук. Нажмите ещё раз.</div>';
        });
      }

      function playBeep(type) {
        if (!soundAllowed) return;
        if (!soundEnabled) return;
        if (!audioUnlocked) return;
        const dataUrl = type === 'short' ? soundsData.beep : soundsData.gong;
        if (!dataUrl) return;
        const audio = new Audio(dataUrl);
        audio.play().catch(e => console.warn('Play error:', e));
      }

      function setVisible(el, on) {
        if (!el) return;
        el.classList.toggle('hidden', !on);
      }

      function escapeHtml(s) {
        return String(s ?? '').replace(/[&<>"']/g, ch => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        })[ch]);
      }

      function setAnswerEnabled(on) {
        answerInput.disabled = !on;
        btnSendAnswer.disabled = !on;
        if (!on) {
          answerInput.placeholder = 'ожидайте';
          answerInput.style.setProperty('background-color', 'var(--disabled-bg)', 'important');
          btnSendAnswer.style.opacity = '0.5';
          btnSendAnswer.style.cursor = 'not-allowed';
        } else {
          answerInput.placeholder = 'Введите ответ...';
          answerInput.style.removeProperty('background-color');
          btnSendAnswer.style.opacity = '';
          btnSendAnswer.style.cursor = '';
        }
      }

      function getOrCreateDeviceId() {
        const key = 'chgkdeviceid';
        let id = localStorage.getItem(key);
        if (id) return id;
        const arr = new Uint8Array(16);
        crypto.getRandomValues(arr);
        id = Array.from(arr).map(b => b.toString(16).padStart(2, '0')).join('');
        localStorage.setItem(key, id);
        return id;
      }
      const deviceId = getOrCreateDeviceId();

      function send(type, payload) {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type, payload }));
        } else {
          console.warn('WebSocket не подключён, сообщение не отправлено');
        }
      }

      function renderTeams() {
        teamSelect.innerHTML = '<option value="">-- Выберите --</option>';
        (teams || []).forEach(t => {
          const opt = document.createElement('option');
          opt.value = String(t.id);
          opt.textContent = t.name + (t.activeCaptain ? ' (занято)' : '');
          teamSelect.appendChild(opt);
        });
        const t = (teams || []).find(x => x.id === myTeamId);
        teamBadge.textContent = t ? t.name : '—';
      }

      function renderTableCompact() {
        if (!lastTable) return;
        scoreHead.innerHTML = '<th>Команда</th><th>Очки</th>';
        scoreBody.innerHTML = '';
        (lastTable.rows || []).forEach(r => {
          const tr = document.createElement('tr');
          tr.innerHTML = ` <td style="text-align:left;">${escapeHtml(r.name)}</td><td>${r.total ?? 0}</td>`;
          scoreBody.appendChild(tr);
        });
      }

      function openFullTableWindow() {
        if (!lastTable) return;
        const qCount = lastTable.questionsCount ?? 0;
        const headCells = ['#', 'Команда']
          .concat(Array.from({ length: qCount }, (_, i) => String(i + 1)))
          .concat(['Итог'])
          .map(x => `<th>${x}</th>`).join('');
        const bodyRows = (lastTable.rows || []).map((r, idx) => {
          const per = r.perQuestion || [];
          const cells = [];
          cells.push(`<td>${idx + 1}</td>`);
          cells.push(`<td style="white-space:nowrap">${escapeHtml(r.name)}</td>`);
          for (let i = 0; i < qCount; i++) {
            const v = per[i];
            cells.push(`<td>${v === true ? '+' : (v === false ? '−' : '')}</td>`);
          }
          cells.push(`<td><strong>${r.total ?? 0}</strong></td>`);
          return `<tr>${cells.join('')}</tr>`;
        }).join('');
        const style = darkTheme
          ? 'body{background:#0d1117;color:#e6edf3;font-family:sans-serif;padding:20px;}table{border-collapse:collapse;width:100%;}th,td{border:1px solid #30363d;padding:8px;text-align:center;}th{background:#21262d;}'
          : 'body{background:#f5f9ff;color:#113355;font-family:sans-serif;padding:20px;}table{border-collapse:collapse;width:100%;}th,td{border:1px solid #bcc9db;padding:8px;text-align:center;}th{background:#d9e2ef;}';
        const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Таблица</title><style>${style}</style></head><body><table><thead>${headCells}</thead><tbody>${bodyRows}</tbody></table></body></html>`;
        const w = window.open('', '_blank');
        if (w) { w.document.write(html); w.document.close(); }
      }
      btnOpenFullTable.onclick = openFullTableWindow;

      function checkSound() {
        if (!shown || shown.phase !== 'question') return;
        if (timer.remainingSec === 0) {
          if (!timer.overtimeActive && !warnedAt0) {
            warnedAt0 = true;
            playBeep('short');
          } else if (timer.overtimeActive && !gongPlayed) {
            gongPlayed = true;
            playBeep('gong');
          }
        }
      }

      function renderAll() {
        timerValue.textContent = timer.remainingSec ?? 60;
        if (timer.overtimeActive) {
          timerCircleDiv.classList.add('overtime');
        } else {
          timerCircleDiv.classList.remove('overtime');
        }

        if (!myTeamId) {
          setVisible(teamBlock, true);
          setVisible(waitBlock, false);
          setVisible(breakBlock, false);
          setVisible(gameBlock, false);
          btnLogout.style.display = 'none';
          return;
        }
        btnLogout.style.display = 'inline-flex';

        if (!shown || shown.phase === 'waiting') {
          setVisible(teamBlock, false);
          setVisible(waitBlock, true);
          setVisible(breakBlock, false);
          setVisible(gameBlock, false);
          phaseTitle.textContent = 'Ждите';
          return;
        }

        if (shown.phase === 'break' || shown.phase === 'table') {
          setVisible(teamBlock, false);
          setVisible(waitBlock, false);
          setVisible(breakBlock, true);
          setVisible(gameBlock, false);
          if (shown.phase === 'break') {
            breakTitle.textContent = 'Перерыв';
            breakBadge.textContent = 'Пауза';
            breakHint.textContent = '';
            setVisible(breakTableWrap, false);
          } else {
            breakTitle.textContent = 'Таблица';
            breakBadge.textContent = 'Очки';
            breakHint.textContent = '';
            setVisible(breakTableWrap, true);
            renderTableCompact();
          }
          return;
        }

        setVisible(teamBlock, false);
        setVisible(waitBlock, false);
        setVisible(breakBlock, false);
        setVisible(gameBlock, true);

        const n = (shown.qIndex ?? 0) + 1;
        if (shown.isWarmup) {
          phaseTitle.textContent = `Разминочный ${shown.warmupNumber}`;
        } else {
          const displayNumber = shown.displayNumber !== undefined ? shown.displayNumber : n;
          phaseTitle.textContent = shown.phase === 'question' ? `Вопрос ${displayNumber}` : `Ответ ${displayNumber}`;
        }

        questionImg.src = shown.handoutImage || '';
        setVisible(questionImg, !!shown.handoutImage);
        commentImg.src = shown.commentImage || '';
        setVisible(commentImg, !!shown.commentImage);

        if (shown.phase === 'question') {
          if (lastQuestionIndex !== shown.qIndex) {
            lastQuestionIndex = shown.qIndex;
            hasSentThisQuestion = false;
            answerInput.value = '';
            answerMsg.innerHTML = '';
            warnedAt0 = false;
            gongPlayed = false;
          }
          questionText.textContent = shown.questionText || '';
          setVisible(correctArea, false);
          setAnswerEnabled(timer.running);
        } else {
          questionText.textContent = '';
          setVisible(correctArea, true);
          const a = shown.answerText || '';
          const c = shown.commentText || '';
          correctText.textContent = c ? `${a}\n\n${c}` : a;
          setAnswerEnabled(false);
          answerInput.value = '';
          answerMsg.innerHTML = '';
        }
        checkSound();
      }

      function sendAnswer(manual) {
        if (!myTeamId || !shown || shown.phase !== 'question') return;
        const text = (answerInput.value || '').trim();
        if (manual && !text) {
          answerMsg.innerHTML = '<div class="msg err">Введите ответ.</div>';
          return;
        }
        if (manual && !timer.running) {
          answerMsg.innerHTML = '<div class="msg err">Таймер не запущен.</div>';
          return;
        }
        if (!manual && hasSentThisQuestion) return;

        lastSentText = text;
        send('captain_send_answer', { text });
        hasSentThisQuestion = true;
        answerInput.value = '';
        answerMsg.innerHTML = `<div class="msg ok">Отправлено: ${escapeHtml(text) || '(пусто)'}</div>`;
      }

      function connectWebSocket() {
        const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
        ws = new WebSocket(`${protocol}://${location.host}/?role=captain`);

        ws.onopen = () => {
          connBadge.textContent = 'Соединение: подключено';
          reconnectAttempts = 0;
          send('captain_hello', { deviceId });
        };

        ws.onerror = () => {
          connBadge.textContent = 'Соединение: ошибка';
        };

        ws.onclose = () => {
          connBadge.textContent = 'Соединение: закрыто, переподключение...';
          const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), maxReconnectDelay);
          reconnectAttempts++;
          setTimeout(connectWebSocket, delay);
        };

        ws.onmessage = (event) => {
          let msg;
          try { msg = JSON.parse(event.data); } catch { return; }
          const { type, payload } = msg || {};

          if (type === 'init_for_captain') {
            teams = payload?.teams || [];
            shown = payload?.shown || { phase: 'waiting' };
            timer = payload?.timer || { running: false, remainingSec: 60, overtimeActive: false };
            soundsData = payload?.sounds || { beep: null, gong: null };
            soundAllowed = payload?.soundEnabled === true;
            updateSoundVisibility();
            renderTeams();
            renderAll();
          } else if (type === 'captain_session') {
            const assigned = payload?.assignedTeamId;
            if (assigned) myTeamId = assigned;
            renderTeams();
            renderAll();
          } else if (type === 'teams_update') {
            teams = payload?.teams || [];
            if (myTeamId !== null && !teams.some(t => t.id === myTeamId)) {
              myTeamId = null;
              teamMsg.innerHTML = '<div class="msg ok">Ваша команда была удалена. Выберите другую.</div>';
            }
            renderTeams();
            renderAll();
          } else if (type === 'team_confirmed') {
            myTeamId = payload?.teamId ?? null;
            teamMsg.innerHTML = '<div class="msg ok">Команда выбрана.</div>';
            renderTeams();
            renderAll();
          } else if (type === 'captain_logged_out') {
            myTeamId = null;
            teamMsg.innerHTML = '<div class="msg ok">Вы вышли.</div>';
            renderTeams();
            renderAll();
          } else if (type === 'shown_update') {
            shown = payload || { phase: 'waiting' };
            if (shown.phase === 'question' && lastQuestionIndex !== shown.qIndex) {
              hasSentThisQuestion = false;
              answerInput.value = '';
              answerMsg.innerHTML = '';
            }
            if (shown.phase === 'answer') {
              answerInput.value = '';
              answerMsg.innerHTML = '';
            }
            renderAll();
          } else if (type === 'timer_update') {
            timer = payload || { running: false, remainingSec: 60, overtimeActive: false };
            if (shown && shown.phase === 'question' && !timer.running && timer.remainingSec === 0) {
              setAnswerEnabled(false);
              sendAnswer(false);
            }
            renderAll();
          } else if (type === 'break_table') {
            lastTable = payload;
            if (shown && shown.phase === 'table') renderTableCompact();
          } else if (type === 'team_kicked') {
            if (myTeamId === payload?.teamId) {
              myTeamId = null;
              teamMsg.innerHTML = '<div class="msg err">Вы исключены администратором.</div>';
              renderTeams();
              renderAll();
            }
          } else if (type === 'error') {
            teamMsg.innerHTML = `<div class="msg err">${escapeHtml(payload?.message || 'Ошибка')}</div>`;
          } else if (type === 'answer_ok') {
            answerMsg.innerHTML = `<div class="msg ok">Ответ "${escapeHtml(lastSentText) || '(пусто)'}" получен сервером.</div>`;
          } else if (type === 'sounds_update') {
            soundsData = payload || { beep: null, gong: null };
          } else if (type === 'sound_permission') {
            soundAllowed = payload?.soundEnabled === true;
            if (!soundAllowed) soundEnabled = false;
            updateSoundVisibility();
            updateSoundButton();
          }
        };
      }

      connectWebSocket();

      btnPickTeam.onclick = () => {
        const id = Number(teamSelect.value);
        if (!id) {
          teamMsg.innerHTML = '<div class="msg err">Выберите команду.</div>';
          return;
        }
        send('captain_pick_team', { teamId: id });
      };

      btnLogout.onclick = () => {
        send('captain_logout', {});
      };

      btnSendAnswer.onclick = () => sendAnswer(true);

      answerInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendAnswer(true);
        }
      });

      soundToggle.onclick = () => {
        soundEnabled = !soundEnabled;
        updateSoundButton();
      };
      updateSoundButton();
      updateSoundVisibility();

      btnUnlockAudio.onclick = unlockAudio;

      // ---- Theme ----
      applyTheme();
      btnTheme.onclick = () => {
        darkTheme = !darkTheme;
        applyTheme();
      };

      // ---- Fullscreen ----
      updateFullscreenBtn();
      btnFullscreen.onclick = toggleFullscreen;

      document.addEventListener('keydown', (e) => {
        if (e.key === 'F11') {
          e.preventDefault();
          toggleFullscreen();
        }
      });
    })();
  </script>
</body>
</html>
